<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glücksrad – DeutschStudio</title>
    
    <!-- Jednotný design systém DeutschStudio -->
    <link rel="stylesheet" href="../../css/style.css">
    
    <style>
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }

        #canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 32px solid #dc2626;
            z-index: 10;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
        }

        .item-list-container {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            background: #f8fafc;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-weight: 600;
        }

        .item-row.disabled {
            opacity: 0.5;
            background: #f1f5f9;
            text-decoration: line-through;
        }

        .badge-date {
            font-size: 0.75rem;
            color: #64748b;
            margin-left: 8px;
            font-weight: normal;
        }

        .tab-btn {
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            border: none;
            cursor: pointer;
            background: #e2e8f0;
            color: #475569;
        }

        .tab-btn.active {
            background: #1f4e79;
            color: white;
        }

        /* Nový vylepšený design modálního okna a tlačítek */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal-overlay.hidden {
            display: none !important;
        }

        .modal-card {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            animation: modalScaleUp 0.2s ease-out;
        }

        @keyframes modalScaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-card .result-name {
            font-size: 24px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 25px;
            word-break: break-word;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .modal-buttons button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Výrazná tlačítka pro modální okno */
        .modal-btn-primary {
            background-color: #2e7d32;
            color: white;
            box-shadow: 0 4px 6px rgba(46, 125, 50, 0.2);
        }

        .modal-btn-primary:hover {
            background-color: #1b5e20;
            transform: translateY(-1px);
        }

        .modal-btn-secondary {
            background-color: #f0f0f0;
            color: #444444;
            border: 1px solid #dcdcdc;
        }

        .modal-btn-secondary:hover {
            background-color: #e4e4e4;
            transform: translateY(-1px);
        }

        .modal-btn-danger {
            background-color: #d32f2f;
            color: white;
            box-shadow: 0 4px 6px rgba(211, 47, 47, 0.2);
        }

        .modal-btn-danger:hover {
            background-color: #c62828;
            transform: translateY(-1px);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="bg-slate-100 p-6">

    <div class="ds-panel">
        <h2 class="ds-title">🎡 Glücksrad</h2>

        <!-- Přepínání záložek: Žáci vs. Slovíčka -->
        <div class="flex gap-2 border-b border-slate-300 mt-4">
            <button id="tabStudentsBtn" class="tab-btn active" onclick="switchTab('students')">
                👨‍🎓 Schüler der Klasse
            </button>
            <button id="tabVocabBtn" class="tab-btn" onclick="switchTab('vocab')">
                📚 Wortschatz der Lektion
            </button>
        </div>

        <!-- Ovládací prvky pro REŽIM ŽÁCI -->
        <div id="controlsStudents" class="flex flex-wrap gap-4 mt-4">
            <label class="ds-label">
                Klasse:
                <select id="classSelect" class="ds-select" onchange="loadClassData()">
                <option value="7A">7.A</option>
                <option value="7B">7.B</option>
                <option value="7C">7.C</option>
                <option value="8A">8.A</option>
                <option value="8B">8.B</option>
                <option value="8C">8.C</option>
                <option value="9A">9.A</option>
                <option value="9B">9.B</option>
                <option value="9C">9.C</option>
                </select>
            </label>
        </div>

        <!-- Ovládací prvky pro REŽIM SLOVÍČKA -->
        <div id="controlsVocab" class="flex flex-wrap gap-4 mt-4 hidden">
            <label class="ds-label">
                Sprache am Rad:
                <select id="langSelect" class="ds-select" onchange="prepareVocabItems()">
                    <option value="de">Deutsch (DE)</option>
                    <option value="cz">Tschechisch (CZ)</option>
                </select>
            </label>

            <label class="ds-label">
                Anzahl der Wörter:
                <select id="countSelect" class="ds-select" onchange="prepareVocabItems()">
                    <option value="5">5 Wörter</option>
                    <option value="10">10 Wörter</option>
                    <option value="15" selected>15 Wörter</option>
                    <option value="20">20 Wörter</option>
                </select>
            </label>

            <!-- Skóre vyhodnocení -->
            <div id="vocabScoreTracker" class="flex items-center gap-4 bg-slate-100 px-4 py-2 rounded-lg border border-slate-300 font-bold text-slate-700">
                <span>Verbleibend: <strong id="wordsLeftCount" class="text-blue-600">0 / 0</strong></span>
                <span>|</span>
                <span>Punkte (Richtig : Falsch): <strong id="scoreText" class="text-emerald-600">0 : 0</strong></span>
            </div>
        </div>

        <!-- Hlavní grid: Kolo + Seznam -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-6 items-start">
            
          <!-- Levý sloupec: Kolo štěstí -->
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div class="wheel-container" style="width: 500px; height: 500px; position: relative;">
                    <div style="position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 36px solid #dc2626; z-index: 10; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3);"></div>
                    <canvas id="canvas" width="500" height="500" style="width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);"></canvas>
                </div>
                
                <!-- Obrovské, vycentrované tlačítko hned pod kolem -->
                <button id="spinBtn" onclick="spinWheel()" style="margin-top: 24px; background-color: #2e7d32; color: white; font-size: 26px; font-weight: 900; padding: 18px 48px; border-radius: 16px; border: none; cursor: pointer; box-shadow: 0 10px 20px rgba(46, 125, 50, 0.4); transition: all 0.2s ease; letter-spacing: 1px;">
                    🎰 Rad drehen!
                </button>
            </div>

            <!-- Pravý sloupec: Seznam položek -->
            <div>
                <h3 id="listTitle" class="font-bold text-slate-700 mb-2">Klassenliste / Liste der Schüler:</h3>
                
                <div class="flex gap-2 mb-3">
                    <input type="text" id="newItemInput" placeholder="Eigenen Namen / Begriff hinzufügen..." class="ds-select flex-1" onkeypress="if(event.key==='Enter') addItem()">
                    <button class="ds-btn ds-btn-success" onclick="addItem()">+ Hinzufügen</button>
                </div>

                <div id="itemList" class="item-list-container">
                    <!-- Položky se načtou dynamicky -->
                </div>
            </div>
        </div>

        <div class="mt-8 border-t pt-4">
            <button class="ds-btn ds-btn-secondary" onclick="window.location.href='../../index.html'">
                🏠 Zurück zum Dashboard
            </button>
        </div>
    </div>

    <!-- MODÁLNÍ OKNO PRO VÝSLEDEK / ZKOUŠENÍ -->
    <div id="winnerModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div id="modalIcon" style="font-size: 3.5rem;">🎉</div>
            <div id="modalSubtitle" class="text-slate-500 font-bold uppercase tracking-wider text-sm mt-2">Ausgewählt:</div>
            <div id="winnerText" class="result-name"></div>

            <!-- 1. Tlačítka PRO ŽÁKY (Zkoušení) - opraveno do němčiny s novým stylem -->
            <div id="studentModalControls" class="modal-buttons">
                <button class="modal-btn-primary" onclick="confirmWinner()">
                    ✓ Versuch eintragen & schließen
                </button>
                <button class="modal-btn-secondary" onclick="closeModal()">
                    Ohne Eintrag schließen
                </button>
            </div>

            <!-- 2. Tlačítka PRO SLOVÍČKA (Hodnocení) -->
            <div id="vocabModalControls" class="modal-buttons hidden">
                <button class="modal-btn-primary" onclick="rateAnswer(true)">
                    ✓ Richtig (+1)
                </button>
                <button class="modal-btn-danger" onclick="rateAnswer(false)">
                    ✕ Falsch (0)
                </button>
            </div>

            <!-- 3. Tlačítko pro Konec zkoušení slovíček (Vyhodnocení známky) -->
            <div id="finalModalControls" class="modal-buttons hidden">
                <button class="modal-btn-primary" onclick="closeModal()">
                    ✕ Schließen und beenden
                </button>
            </div>
        </div>
    </div>

    <!-- Načtení opravené logiky Kola štěstí -->
    <script src="wheel.js"></script>
</body>
</html>
