<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glücksrad – DeutschStudio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1f4e79;
            --der-color: #1e40af;
            --die-color: #dc2626;
            --das-color: #059669;
        }
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 20px;
            overflow-x: hidden;
        }
        .ds-panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            width: min(100%, 1100px);
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .ds-title {
            margin: 0 0 15px 0;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .ds-label {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }
        .ds-select, .ds-input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        .ds-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .ds-btn-primary { background-color: var(--primary); }
        .ds-btn-success { background-color: #059669; }
        .ds-btn-danger { background-color: #dc2626; }
        .ds-btn-secondary { background-color: #64748b; }
        .ds-btn-sm { padding: 4px 8px; font-size: 0.8rem; }
        
        .main-layout {
            width: min(100%, 1100px);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
            align-items: stretch;
        }

        @media(max-width: 768px) {
            body { padding: 10px; }
            .main-layout { grid-template-columns: 1fr; }
            .ds-panel { padding: 14px; }
        }
        .wheel-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        /* =====================================================
           FOCUS / FULLSCREEN REŽIM KOLA
           Kolo se vejde vždy celé do obrazovky.
           ===================================================== */
        .wheel-container.fullscreen-spin {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            z-index: 2500 !important;
            margin: 0 !important;
            padding: 24px !important;
            border: none !important;
            border-radius: 0 !important;
            background: rgba(255, 255, 255, 0.98) !important;
            box-shadow: none !important;
            transform: none !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            overflow: hidden !important;
        }

        .wheel-container.fullscreen-spin #canvas {
            width: min(82vh, 82vw) !important;
            height: min(82vh, 82vw) !important;
            max-width: 90vw !important;
            max-height: 82vh !important;
        }

        .wheel-container.fullscreen-spin .wheel-pointer {
            top: calc(50% - min(41vh, 41vw) - 3px);
        }

        .wheel-container.fullscreen-spin #spinBtn {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: min(360px, 70vw) !important;
            margin: 0 !important;
        }

        .fullscreen-exit {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 20;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            background: #0f172a;
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,.18);
        }

        .fullscreen-exit:hover {
            background: #334155;
        }

        /* Ztmavení pozadí pod kolem při otáčení pro dokonalý fokus */
        body.is-spinning::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 1500;
            backdrop-filter: blur(4px);
        }
        #canvas {
            cursor: pointer;
        }
        .wheel-pointer {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid #ef4444;
            z-index: 10;
        }
        .list-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            max-height: 500px;
            display: flex;
            flex-direction: column;
        }
        .item-list {
            overflow-y: auto;
            flex-grow: 1;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .item-row.disabled {
            opacity: 0.5;
            text-decoration: line-through;
            background: #f1f5f9;
        }
        .badge-date {
            font-size: 0.75rem;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            color: #475569;
        }
        .hidden { display: none !important; }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <div class="ds-panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 class="ds-title"><i class="fas fa-dharmachakra"></i> Glücksrad (Kolo štěstí)</h2>
            <a href="../../index.html" class="ds-btn ds-btn-secondary ds-btn-sm"><i class="fas fa-home"></i> Zurück zum Dashboard</a>
        </div>

        <div class="flex-wrap" style="margin-top: 15px;">
            <div style="display: flex; gap: 5px;">
                <button id="tabStudentsBtn" class="tab-btn active" onclick="switchTab('students')">👨‍🎓 Schüler (žáci)</button>
                <button id="tabVocabBtn" class="tab-btn" onclick="switchTab('vocab')">📚 Wortschatz (Slovíčka) </button>
            </div>

            <!-- Ovládání pro žáky -->
            <div id="controlsStudents" class="flex-wrap">
                <label class="ds-label">
                    Klasse:
                    <select id="classSelect" class="ds-select" onchange="loadClassData()">
                        <option value="7A">7.A</option>
                        <option value="7B">7.B</option>
                        <option value="7C">7.C</option>
                        <option value="8A">8.A</option>
                        <option value="8B">8.B</option>
                        <option value="8C">8.C</option>
                        <option value="9A">9.A</option>
                        <option value="9B">9.B</option>
                    </select>
                </label>
            </div>

            <!-- Ovládání pro slovíčka -->
            <div id="controlsVocab" class="flex-wrap hidden">
                <label class="ds-label">
                    Jazyk:
                    <select id="langSelect" class="ds-select" onchange="prepareVocabItems()">
                        <option value="de">Německy (Artikel + DE)</option>
                        <option value="cz">Česky (CZ)</option>
                    </select>
                </label>
                <label class="ds-label">
                    Počet slov:
                    <select id="countSelect" class="ds-select" onchange="prepareVocabItems()">
                        <option value="10">10 slov</option>
                        <option value="15" selected>15 slov</option>
                        <option value="20">20 slov</option>
                        <option value="5">5 slov</option>
                    </select>
                </label>
            </div>

            <!-- Posuvník rychlosti -->
            <label class="ds-label" style="margin-left: auto;">
                Rychlost kola:
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="range" id="speedRange" min="0.5" max="2.5" step="0.1" value="1.0">
                    <span id="speedValue" style="font-weight: bold; color: var(--primary);">1.0x</span>
                </div>
            </label>
        </div>
    </div>

    <div class="main-layout">
        <!-- Kolo štěstí -->
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <button id="fullscreenBtn" class="fullscreen-exit" type="button" onclick="toggleWheelFullscreen()" title="Režim celé obrazovky">
                <i class="fas fa-expand"></i> Celá obrazovka
            </button>
            <canvas id="canvas" width="360" height="360" onclick="spinWheel()"></canvas>
            <button id="spinBtn" class="ds-btn ds-btn-primary" style="margin-top: 15px; width: 100%;" onclick="spinWheel()">
                <i class="fas fa-play"></i> Rad drehen!
            </button>
        </div>

        <!-- Seznam položek -->
        <div class="list-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="listTitle" style="margin: 0; font-size: 1.1rem;">Seznam:</h3>
                <div id="vocabScoreTracker" class="hidden" style="font-weight: bold; font-size: 0.9rem; color: #0f172a;">
                    Zbývá: <span id="wordsLeftCount">0</span> | Skóre: <span id="scoreText">0 : 0</span>
                </div>
            </div>

            <!-- Vložení nového žáka / položky -->
            <div style="display: flex; gap: 8px; margin-top: 12px;">
                <input type="text" id="newItemInput" class="ds-input" placeholder="Přidat položku..." style="flex: 1;" onkeypress="if(event.key==='Enter') addItem()">
                <button class="ds-btn ds-btn-success ds-btn-sm" onclick="addItem()"><i class="fas fa-plus"></i> Přidat</button>
            </div>

            <div id="itemList" class="item-list"></div>
        </div>
    </div>

    <!-- Modální okno po roztočení -->
    <div id="winnerModal" class="modal hidden">
        <div class="modal-content">
            <div id="modalIcon" style="font-size: 3rem; margin-bottom: 10px;">🎉</div>
            <div id="modalSubtitle" style="font-weight: 600; color: #64748b; margin-bottom: 5px;">Vybráno:</div>
            <div id="winnerText" style="font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 20px;"></div>

            <!-- Ovládání pro žáky -->
            <div id="studentModalControls" class="flex" style="justify-content: center; gap: 10px;">
                <button class="ds-btn ds-btn-success" onclick="confirmWinner()"><i class="fas fa-check"></i> Potvrdit a vyřadit</button>
                <button class="ds-btn ds-btn-secondary" onclick="closeModal()">Zavřít</button>
            </div>

            <!-- Ovládání pro slovíčka -->
            <div id="vocabModalControls" class="flex hidden" style="justify-content: center; gap: 10px; margin-bottom: 10px;">
                <button class="ds-btn ds-btn-success" onclick="rateAnswer(true)"><i class="fas fa-check"></i> Richtig</button>
                <button class="ds-btn ds-btn-danger" onclick="rateAnswer(false)"><i class="fas fa-times"></i> Falsch</button>
            </div>
            <div id="skipModalControl" class="flex hidden" style="justify-content: center;">
    <button id="skipWordBtn" class="ds-btn ds-btn-secondary" onclick="skipWord()">
        <i class="fas fa-forward"></i> Überspringen (Přeskočit) <span id="skipCountBadge" style="font-size: 0.8rem; margin-left: 5px;">(2/2)</span>
    </button>
</div>

            <!-- Finální tlačítka -->
            <div id="finalModalControls" class="flex hidden" style="justify-content: center;">
                <button class="ds-btn ds-btn-primary" onclick="closeModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Dynamická aktualizace textu posuvníku rychlosti
        document.getElementById('speedRange')?.addEventListener('input', (e) => {
            document.getElementById('speedValue').innerText = e.target.value + 'x';
        });
    </script>
    <script>
        // =====================================================
        // Režim soustředění / fullscreen kola
        // =====================================================
        function toggleWheelFullscreen() {
            const wheel = document.querySelector('.wheel-container');
            const btn = document.getElementById('fullscreenBtn');
            if (!wheel) return;

            const active = wheel.classList.toggle('fullscreen-spin');
            document.body.classList.toggle('wheel-focus-mode', active);

            if (btn) {
                btn.innerHTML = active
                    ? '<i class="fas fa-compress"></i> Zavřít'
                    : '<i class="fas fa-expand"></i> Celá obrazovka';
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                const wheel = document.querySelector('.wheel-container');
                if (wheel?.classList.contains('fullscreen-spin')) {
                    toggleWheelFullscreen();
                }
            }
        });

        document.getElementById('speedRange')?.addEventListener('input', (e) => {
            document.getElementById('speedValue').innerText = e.target.value + 'x';
        });
    </script>
    <script src="wheel.js"></script>
</body>
</html>
