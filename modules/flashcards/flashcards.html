<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeutschStudio – Flashkarten (Kartičky)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-link {
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary);
        }

        .controls-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 140px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }

        select, button {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            background: #fff;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* 3D Kartička – fixní rozumná výška, aby se neroztahovala mimo náhled */
        .flashcard-container {
            width: 100%;
            height: 340px;
            perspective: 1000px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border-radius: 16px;
            border: 4px solid var(--border);
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #f1f5f9;
        }

        .card-image {
            max-width: 130px;
            max-height: 130px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .card-text {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .card-translation {
            font-size: 2rem;
            font-weight: 600;
            color: #334155;
        }

        .audio-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--primary);
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s;
        }

        .audio-btn:active {
            transform: scale(0.9);
        }

        /* Navigace */
        .nav-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 15px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .counter {
            font-weight: 600;
            color: #64748b;
        }

        /* Režim celé obrazovky – pouze zde se karta výrazně zvětší a schovají se panely */
        body.fullscreen-mode {
            background: #0f172a !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            height: 100vh !important;
            margin: 0 !important;
            overflow: hidden !important;
        }

        body.fullscreen-mode .header,
        body.fullscreen-mode .controls-box {
            display: none !important;
        }

        body.fullscreen-mode .container {
            max-width: 900px !important;
            width: 90% !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 20px !important;
        }

        body.fullscreen-mode .flashcard-container {
            height: 65vh !important;
            width: 100% !important;
        }

        body.fullscreen-mode .card-text {
            font-size: 4rem !important;
        }

        body.fullscreen-mode .card-translation {
            font-size: 3.5rem !important;
        }

        body.fullscreen-mode .card-image {
            max-width: 250px !important;
            max-height: 250px !important;
        }

        body.fullscreen-mode .nav-box {
            width: 100% !important;
            display: flex !important;
            justify-content: space-between !important;
        }

        body.fullscreen-mode .nav-btn {
            font-size: 1.1rem !important;
            padding: 12px 24px !important;
        }

        body.fullscreen-mode .counter {
            color: #94a3b8 !important;
            font-size: 1.2rem !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="../../index.html" class="back-link"><i class="fas fa-home"></i> Zpět na Dashboard</a>
            <h1><i class="fas fa-id-card"></i> Flashkarten</h1>
        </div>

        <div class="controls-box">
            <div class="control-group">
                <label for="bookSelect">Učebnice:</label>
                <select id="bookSelect" onchange="onBookChange()"></select>
            </div>
            <div class="control-group">
                <label for="lessonSelect">Lekce:</label>
                <select id="lessonSelect" onchange="onLessonChange()"></select>
            </div>
            <div class="control-group">
                <label for="frontSideSelect">Přední strana:</label>
                <select id="frontSideSelect" onchange="changeMode()">
                    <option value="de">Německy (DE)</option>
                    <option value="cz">Česky (CZ)</option>
                    <option value="image">Obrázek (pokud existuje, jinak DE)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="countSelect">Počet karet:</label>
                <select id="countSelect" onchange="prepareActiveCards()">
                    <option value="all">Všechna slova</option>
                    <option value="8">8 karet</option>
                    <option value="12" selected>12 karet</option>
                    <option value="16">16 karet</option>
                    <option value="20">20 karet</option>
                </select>
            </div>
            <div class="control-group" style="justify-content: flex-end; flex: 0;">
                <label>&nbsp;</label>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-primary" onclick="shuffleCards()" title="Zamíchat kartičky"><i class="fas fa-shuffle"></i></button>
                    <button id="audioToggleBtn" class="btn-primary" onclick="toggleAutoAudio()" title="Auto audio zapnuto/vypnuto" style="background: #059669;"><i class="fas fa-volume-high" id="audioIcon"></i></button>
                    <button class="btn-primary" onclick="toggleFullScreen()" title="Celá obrazovka"><i class="fas fa-expand"></i></button>
                </div>
            </div>
        </div>

        <!-- 3D Kartička -->
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front" id="cardFront">
                    <!-- Dynamický obsah přední strany -->
                </div>
                <div class="card-face card-back" id="cardBack">
                    <!-- Dynamický obsah zadní strany -->
                </div>
            </div>
        </div>

        <!-- Navigace -->
        <div class="nav-box">
            <button class="btn-primary nav-btn" onclick="prevCard()"><i class="fas fa-arrow-left"></i> Předchozí</button>
            <span class="counter" id="cardCounter">0 / 0</span>
            <button class="btn-primary nav-btn" onclick="nextCard()">Další <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <script type="module" src="flashcards.js"></script>
</body>
</html>
